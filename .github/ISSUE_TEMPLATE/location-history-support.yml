name: Where I Went support
description: Report a problem or request an improvement without sharing private location data.
title: "[Where I Went] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Where I Went. This report is public.

        Do not include precise locations, Timeline screenshots, exported history, CloudKit identifiers, or other personal data.

        For a private reply, use the [support page](https://anishharis.github.io/location-history/support/) instead.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - Mac
        - Both
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find this in Advanced Settings. For example, 1.0 (26).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior without including any private location information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed precise locations, screenshots, exports, identifiers, and other personal data.
          required: true
