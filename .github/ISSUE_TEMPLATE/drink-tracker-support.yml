name: Drinkmark support
description: Ask for help or suggest an improvement without sharing private health or location data.
title: "[Drinkmark] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        This support request is public. Please use made-up dates and counts.

        Do not include drink or Apple Health history, journal screenshots, CSV exports, precise locations, account or device identifiers, phone numbers, email addresses, or other personal data.
  - type: dropdown
    id: feature
    attributes:
      label: Which part of Drinkmark?
      options:
        - Logging and count controls
        - Calendar and drink-free days
        - Apple Health
        - History Assistant
        - Reminders
        - Possible visits
        - Export
        - Something else
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Include the version if you know it, or write unknown. Do not attach logs or exports.
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: For example, iOS 26. Do not include a device identifier.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior without personal journal, Health, or location information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use made-up dates and counts. Do not attach personal screenshots or files.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I understand this request is public and have removed private health, journal, location, account, and contact information.
          required: true
